<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Dance</title>
<style>
  :root {
    --clawd: #d97757;
    --clawd-dark: #b85c3e;
    --bg: #1a1423;
    --floor-a: #2b2140;
    --floor-b: #3a2d55;
    --text: #f5efe6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Disco lights sweeping the room */
  .lights {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 80, 160, .25), transparent 40%),
      radial-gradient(circle at 80% 25%, rgba(80, 200, 255, .25), transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(255, 220, 80, .2), transparent 45%);
    animation: lights 4s linear infinite;
  }
  @keyframes lights { to { filter: hue-rotate(360deg); } }

  .stage {
    position: relative;
    width: min(420px, 90vw);
    aspect-ratio: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 22%;
    background: repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 0 0 / 40px 40px;
    border-radius: 50%;
    animation: floor .5s steps(1) infinite;
  }
  @keyframes floor { 50% { filter: brightness(1.6) hue-rotate(90deg); } }

  .clawd {
    position: relative;
    width: 70%;
    margin-bottom: 10%;
    transform-origin: 50% 100%;
    animation: groove 1s ease-in-out infinite;
  }
  .clawd svg { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .clawd .arm-l, .clawd .arm-r { transform-box: fill-box; }
  .clawd .arm-l { transform-origin: 100% 50%; animation: wave-l .5s ease-in-out infinite alternate; }
  .clawd .arm-r { transform-origin: 0% 50%;   animation: wave-r .5s ease-in-out infinite alternate; }
  .clawd .leg { transform-box: fill-box; transform-origin: 50% 0%; }
  .clawd .leg.a { animation: step .5s ease-in-out infinite alternate; }
  .clawd .leg.b { animation: step .5s ease-in-out infinite alternate-reverse; }
  .clawd .eyes { animation: blink 3s infinite; transform-box: fill-box; transform-origin: center; }

  /* Default move: side-to-side bounce */
  @keyframes groove {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    25%      { transform: translateY(-14%) rotate(0deg); }
    50%      { transform: translateY(0) rotate(8deg); }
    75%      { transform: translateY(-14%) rotate(0deg); }
  }
  @keyframes wave-l { from { transform: rotate(25deg); }  to { transform: rotate(-35deg); } }
  @keyframes wave-r { from { transform: rotate(-25deg); } to { transform: rotate(35deg); } }
  @keyframes step   { from { transform: scaleY(1); }      to { transform: scaleY(.45); } }
  @keyframes blink  { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* Alternate moves */
  #m-spin:checked   ~ .stage .clawd { animation: spin 1.2s ease-in-out infinite; }
  @keyframes spin {
    0%   { transform: translateY(0) rotateY(0); }
    50%  { transform: translateY(-20%) rotateY(180deg); }
    100% { transform: translateY(0) rotateY(360deg); }
  }
  #m-wiggle:checked ~ .stage .clawd { animation: wiggle .3s ease-in-out infinite alternate; }
  @keyframes wiggle {
    from { transform: skewX(-12deg) scaleY(.95); }
    to   { transform: skewX(12deg) scaleY(1.05); }
  }
  #m-hop:checked    ~ .stage .clawd { animation: hop .6s cubic-bezier(.3, 0, .7, 1) infinite; }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1.1, .85); }
    40%      { transform: translateY(-35%) scale(.92, 1.1); }
    60%      { transform: translateY(-35%) scale(.92, 1.1) rotate(10deg); }
  }

  .note {
    position: absolute;
    font-size: 28px;
    color: var(--clawd);
    opacity: 0;
    animation: float 3s linear infinite;
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) rotate(0); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-180px) rotate(30deg); }
  }

  h1 { margin: 24px 0 8px; font-size: 22px; letter-spacing: .1em; z-index: 1; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 16px; z-index: 1; }
  .moves { position: absolute; opacity: 0; pointer-events: none; }
  .controls label {
    font: inherit;
    padding: 8px 14px;
    border: 2px solid var(--clawd);
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .controls label:hover,
  #m-groove:checked ~ .controls [for=m-groove],
  #m-spin:checked   ~ .controls [for=m-spin],
  #m-wiggle:checked ~ .controls [for=m-wiggle],
  #m-hop:checked    ~ .controls [for=m-hop] { background: var(--clawd); color: var(--bg); }
  #m-groove:focus-visible ~ .controls [for=m-groove],
  #m-spin:focus-visible   ~ .controls [for=m-spin],
  #m-wiggle:focus-visible ~ .controls [for=m-wiggle],
  #m-hop:focus-visible    ~ .controls [for=m-hop] { outline: 2px solid var(--text); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 3s !important; }
  }
</style>
</head>
<body>
  <!-- Dance moves are radio buttons so switching works with CSS alone, no JavaScript needed -->
  <input class="moves" type="radio" name="move" id="m-groove" checked>
  <input class="moves" type="radio" name="move" id="m-spin">
  <input class="moves" type="radio" name="move" id="m-wiggle">
  <input class="moves" type="radio" name="move" id="m-hop">

  <div class="lights"></div>

  <div class="stage">
    <div class="floor"></div>
    <span class="note" style="left:8%;  bottom:40%; animation-delay:0s">&#9834;</span>
    <span class="note" style="left:82%; bottom:50%; animation-delay:1s">&#9835;</span>
    <span class="note" style="left:20%; bottom:65%; animation-delay:2s">&#9833;</span>
    <span class="note" style="left:70%; bottom:30%; animation-delay:1.5s">&#9836;</span>

    <div class="clawd">
      <!-- Clawd, drawn on a 16x12 pixel grid -->
      <svg viewBox="0 0 16 12" shape-rendering="crispEdges" aria-label="Clawd dancing">
        <rect class="arm-l" x="0"  y="4" width="2" height="2" fill="var(--clawd)"/>
        <rect class="arm-r" x="14" y="4" width="2" height="2" fill="var(--clawd)"/>
        <rect x="2" y="1" width="12" height="8" fill="var(--clawd)"/>
        <g class="eyes">
          <rect x="5"  y="3" width="1" height="2" fill="#111"/>
          <rect x="10" y="3" width="1" height="2" fill="#111"/>
        </g>
        <rect class="leg a" x="3"  y="9" width="1" height="3" fill="var(--clawd-dark)"/>
        <rect class="leg b" x="5"  y="9" width="1" height="3" fill="var(--clawd-dark)"/>
        <rect class="leg a" x="10" y="9" width="1" height="3" fill="var(--clawd-dark)"/>
        <rect class="leg b" x="12" y="9" width="1" height="3" fill="var(--clawd-dark)"/>
      </svg>
    </div>
  </div>

  <h1>CLAWD IS DANCING</h1>
  <div class="controls">
    <label for="m-groove">Groove</label>
    <label for="m-spin">Spin</label>
    <label for="m-wiggle">Wiggle</label>
    <label for="m-hop">Hop</label>
  </div>
</body>
</html>
